name: Update CV from Google Docs

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  sync-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CV as PDF
        run: |
          DOC_ID="1z4E6n4tK0uXz5eY5ZgxTjh6Go8qo-aKbEuhzqzGoWP8"
          curl -L "https://docs.google.com/document/d/$DOC_ID/export?format=pdf" -o files/cv.pdf

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add files/cv.pdf
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update CV from google docs" && git push)
